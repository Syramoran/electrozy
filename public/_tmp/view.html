<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; background: #fff; }
      canvas { display: block; width: 100%; height: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  </head>
  <body>
    <script>
      const q = new URLSearchParams(location.search)
      const file = q.get('f')
      const page = Number(q.get('p') || 1)
      const scale = Number(q.get('s') || 2.5)
      const y0 = Number(q.get('y0') || 0)
      const y1 = Number(q.get('y1') || 1)
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
      pdfjsLib.getDocument(file).promise.then(async (pdf) => {
        document.title = 'pages:' + pdf.numPages
        const p = await pdf.getPage(page)
        const vp = p.getViewport({ scale })
        const full = document.createElement('canvas')
        full.width = vp.width
        full.height = vp.height
        await p.render({ canvasContext: full.getContext('2d'), viewport: vp }).promise
        const c = document.createElement('canvas')
        c.width = vp.width
        c.height = Math.round(vp.height * (y1 - y0))
        c.getContext('2d').drawImage(full, 0, -Math.round(vp.height * y0))
        document.body.appendChild(c)
        document.body.dataset.done = '1'
      })
    </script>
  </body>
</html>
